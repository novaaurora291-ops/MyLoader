name: windows-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Engine unit tests (parser, layout, blend maths, WGSL validation)
        run: cargo test -p myloader-engine

      - name: CLI smoke test (CPU render + x264, CI has no GPU)
        shell: pwsh
        run: |
          $env:Path = "C:\ProgramData\chocolatey\bin;" + $env:Path
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc2=s=1280x720:r=30:d=2" -f lavfi -i "sine=d=2" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest in.mp4
          cargo run --release -p myloader-engine --bin mlcli -- new in.mp4 -o p.mlproj --aspect 9:16 --preset presets/hdr-cc-lyrics.xml
          cargo run --release -p myloader-engine --bin mlcli -- export p.mlproj -o out.mp4 --res 1080 --fps 30 --encoder cpu --cpu
          ffprobe -v error -show_entries stream=codec_name,width,height -of compact out.mp4

      - name: Frontend type-check
        run: |
          npm ci
          npm run typecheck

      - name: Build installer
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: MyLoader-windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
